<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="64" height="64" rx="16" fill="#090d16" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2" />
  <!-- KK Monogram -->
  <g filter="url(#glow)" fill="url(#kkGrad)">
    <!-- First K -->
    <path d="M 14 16 L 20 16 L 20 48 L 14 48 Z" />
    <path d="M 29 16 L 20 28 L 20 33 L 30 16 Z" />
    <path d="M 18 31 L 28 48 L 35 48 L 24 30 Z" />
    <!-- Second K -->
    <path d="M 36 16 L 42 16 L 42 48 L 36 48 Z" />
    <path d="M 51 16 L 42 28 L 42 33 L 52 16 Z" />
    <path d="M 40 31 L 50 48 L 57 48 L 46 30 Z" />
  </g>
</svg>